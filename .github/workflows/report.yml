name: 薩摩AI修行日誌 - 自動報告生成

on:
  push:
    paths:
      - "articles/**"   # articlesフォルダへのpushだけを検知

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 画像をgit pushするために必要

    steps:
      # ① リポジトリをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      # ② 変更されたarticlesファイルを特定
      - name: 変更された記事ファイルを取得
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'articles/*.md' 'articles/*.html' | head -1)
          echo "file=$CHANGED" >> $GITHUB_OUTPUT
          echo "変更ファイル: $CHANGED"

      # ③ Python セットアップ
      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ④ 依存パッケージをインストール
      - name: 依存パッケージをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ⑤ Playwright ブラウザをインストール
      - name: Playwright Chromium をインストール
        run: playwright install chromium --with-deps

      # ⑤-b surge CLI をインストール
      - name: surge CLI をインストール
        run: npm install -g surge

      # ⑥ メインスクリプトを実行
      - name: 報告カードを生成
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_WEBHOOK_URL:  ${{ secrets.LINE_WEBHOOK_URL }}
          SURGE_TOKEN:       ${{ secrets.SURGE_TOKEN }}
        run: |
          FILE="${{ steps.changed.outputs.file }}"
          if [ -z "$FILE" ]; then
            echo "変更された記事ファイルが見つかりませんでした。スキップします。"
            exit 0
          fi
          python scripts/generate.py "$FILE"

      # ⑦ 生成した画像をArtifactとして保存（ダウンロード可能にする）
      - name: 生成画像をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: report-image
          path: output/*.png
          retention-days: 30
